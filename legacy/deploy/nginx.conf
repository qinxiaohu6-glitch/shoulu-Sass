# /etc/nginx/sites-available/product-atlas
#
# 把 product-atlas 顶到公网。应用本身是一个 Python 线程化 HTTP 服务，
# 监听 127.0.0.1:8898；nginx 只负责 TLS、压缩和把静态资源直接从磁盘发出去。
#
# 部署后：
#   sudo ln -s /etc/nginx/sites-available/product-atlas /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name dirtool.com www.dirtool.com;

    # certbot 的 http-01 挑战走这里，别提前 301
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 22.04 自带 nginx 1.18、24.04 自带 1.24，都还不认 `http2 on;`，
    # 只能写在 listen 上。升级到 1.25.1+ 后再改成 `http2 on;`。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dirtool.com www.dirtool.com;

    ssl_certificate     /etc/letsencrypt/live/dirtool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dirtool.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 提交表单是 JSON，最大 64KB 就够；给到 1m 留余量，也挡住大包攻击
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # 静态资源让 nginx 直接发，不经过 Python。文件名带 ?v=<hash>，所以长缓存是安全的。
    # 注意：这里不能用 `try_files $uri`——在 alias 块里它会把 $uri 再拼一次，
    # 变成 assets/assets/…，文件必然 404。让 nginx 自己 404 就好。
    location /assets/ {
        alias /opt/product-atlas/assets/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8898;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 应用靠 X-Forwarded-For 做按 IP 限流，这两个头不能丢
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
